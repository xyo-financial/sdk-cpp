<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .axis-label { font-size: 12px; font-weight: 600; fill: #64748B; text-anchor: middle; }
    .track-title { font-size: 13px; font-weight: 700; fill: #E2E8F0; text-anchor: end; }
    .bar-text { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
    .legend-text { font-size: 12px; font-weight: 500; fill: #CBD5E1; }
    .marker-text { font-size: 11px; font-weight: 700; fill: #00D2FF; text-anchor: middle; }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="960" height="400" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="24" y="24" width="8" height="28" rx="4" fill="url(#brandGrad)"/>
  <text x="42" y="38" class="title">C++ Standard &amp; Compiler LTS Support Schedule</text>
  <text x="42" y="55" class="subtitle">XYO Financial Enterprise SDK • 3-Month Proactive Toolchain Deprecation Policy</text>

  <!-- Grid & Timeline Axis (2023 - 2028) -->
  <g transform="translate(170, 85)">
    <!-- Vertical Grid Lines -->
    <line x1="0" y1="0" x2="0" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="0" y="-10" class="axis-label">2023</text>

    <line x1="150" y1="0" x2="150" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="150" y="-10" class="axis-label">2024</text>

    <line x1="300" y1="0" x2="300" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="300" y="-10" class="axis-label">2025</text>

    <line x1="450" y1="0" x2="450" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="450" y="-10" class="axis-label">2026</text>

    <line x1="600" y1="0" x2="600" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="600" y="-10" class="axis-label">2027</text>

    <line x1="750" y1="0" x2="750" y2="220" stroke="#1E293B" stroke-width="1.5"/>
    <text x="750" y="-10" class="axis-label">2028</text>

    <!-- Version Tracks -->
    <!-- C++14 & Older (Deprecated) -->
    <text x="-20" y="24" class="track-title">&lt; C++17</text>
    <rect x="0" y="8" width="180" height="24" rx="6" fill="#EF4444" opacity="0.8"/>
    <text x="8" y="24" class="bar-text">Deprecated / Unsupported</text>

    <!-- C++17 Baseline (ISO/IEC 14882:2017) -->
    <text x="-20" y="64" class="track-title">ISO C++17</text>
    <rect x="0" y="48" width="750" height="24" rx="6" fill="#F59E0B" opacity="0.9"/>
    <text x="10" y="64" class="bar-text">Core Enterprise Baseline (GCC 9+, Clang 10+, MSVC 2019+)</text>

    <!-- ISO C++20 Standard -->
    <text x="-20" y="104" class="track-title">ISO C++20</text>
    <rect x="150" y="88" width="600" height="24" rx="6" fill="#10B981"/>
    <text x="158" y="104" class="bar-text">Active Standard (Concepts, Modules, Coroutines)</text>

    <!-- ISO C++23 Standard -->
    <text x="-20" y="144" class="track-title">ISO C++23</text>
    <rect x="300" y="128" width="450" height="24" rx="6" fill="#00D2FF" opacity="0.95"/>
    <text x="308" y="144" class="bar-text" fill="#0F172A">Modern Target (GCC 13+, Clang 16+, MSVC 2022 v143)</text>

    <!-- Future ISO C++26 -->
    <text x="-20" y="184" class="track-title">ISO C++26</text>
    <rect x="450" y="168" width="300" height="24" rx="6" fill="#2563EB" opacity="0.8"/>
    <text x="458" y="184" class="bar-text">Upcoming Standard (Forward Compatible)</text>

    <!-- Current Time Milestone (Mid 2026: ~x=525) -->
    <line x1="525" y1="-25" x2="525" y2="225" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="520,-25 530,-25 525,-15" fill="#00D2FF"/>
    <text x="525" y="-30" class="marker-text">CURRENT (2026)</text>
  </g>

  <!-- Legend Section -->
  <g transform="translate(60, 345)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#10B981"/>
    <text x="22" y="12" class="legend-text">Active Standard &amp; Toolchain</text>

    <rect x="220" y="0" width="14" height="14" rx="3" fill="#00D2FF"/>
    <text x="242" y="12" class="legend-text">Modern Recommended Target</text>

    <rect x="470" y="0" width="14" height="14" rx="3" fill="#F59E0B"/>
    <text x="492" y="12" class="legend-text">C++17 Enterprise Baseline Floor</text>

    <rect x="730" y="0" width="14" height="14" rx="3" fill="#EF4444"/>
    <text x="752" y="12" class="legend-text">Unsupported / EOL</text>
  </g>
</svg>
