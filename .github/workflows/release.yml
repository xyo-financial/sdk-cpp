name: Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write # Required for GitHub OIDC signing and attestation
  attestations: write # Required to upload provenance attestations

jobs:
  verify-tag:
    name: Verify Tag Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        run: |
          git branch -r --contains ${{ github.ref_name }} | grep -E "origin/main" || {
            echo "Error: Tag must be pushed from the main branch."
            exit 1;
          }

      # Every packaging manifest carries the version independently, so each one
      # is checked against the tag. Checking only CMakeLists.txt let conanfile.py
      # sit at a stale version through an entire release cycle unnoticed.
      - name: Verify All Manifests Match Git Tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VER=${TAG_NAME#v} # Strip leading 'v'
          echo "Git tag version: $TAG_VER"

          CMAKE_VER=$(grep -oE 'project\(XYOSDK VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CONAN_VER=$(grep -oE '^\s*version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"' conanfile.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          VCPKG_VER=$(grep -oE '"version"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+"' packaging/vcpkg/vcpkg.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          STATUS=0
          for entry in "CMakeLists.txt:$CMAKE_VER" "conanfile.py:$CONAN_VER" "packaging/vcpkg/vcpkg.json:$VCPKG_VER"; do
            FILE=${entry%%:*}
            VER=${entry#*:}
            if [ -z "$VER" ]; then
              echo "Error: could not parse a version from $FILE"
              STATUS=1
            elif [ "$VER" != "$TAG_VER" ]; then
              echo "Error: $FILE is at $VER but the tag is $TAG_VER"
              STATUS=1
            else
              echo "OK: $FILE is at $VER"
            fi
          done
          exit $STATUS

  run-tests:
    name: Run Tests
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev build-essential
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXYO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

  publish-release:
    name: Publish Release & Artifacts
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Archive creation
      - name: Build Archive
        run: |
          git archive --format=tar.gz --prefix=xyo-sdk-cpp-${{ github.ref_name }}/ -o xyo-sdk-cpp-${{ github.ref_name }}.tar.gz HEAD

      # 2. Generate Checksums
      - name: Generate SHA-256 Checksum
        run: sha256sum xyo-sdk-cpp-${{ github.ref_name }}.tar.gz > xyo-sdk-cpp-${{ github.ref_name }}.tar.gz.sha256

      # 3. Generate SBOM (Software Bill of Materials)
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'
          output-file: 'xyo-sdk-cpp-${{ github.ref_name }}.spdx.json'

      # 4. Generate GitHub Attestation (Provenance & Integrity signatures)
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'xyo-sdk-cpp-${{ github.ref_name }}.tar.gz'

      # 5. Create Github Release with Assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xyo-sdk-cpp-${{ github.ref_name }}.tar.gz
            xyo-sdk-cpp-${{ github.ref_name }}.tar.gz.sha256
            xyo-sdk-cpp-${{ github.ref_name }}.spdx.json
          generate_release_notes: true
          draft: false
          prerelease: false

  verify-example:
    name: Verify Package in Example App
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan & CMake
        run: |
          pip install conan
          conan profile detect --force

      - name: Export Release Version to Conan Cache
        run: |
          TAG_VER=${{ github.ref_name }}
          TAG_VER=${TAG_VER#v} # Strip leading 'v'
          conan export . --version=$TAG_VER

      - name: Configure Example App Dependency
        run: |
          TAG_VER=${{ github.ref_name }}
          TAG_VER=${TAG_VER#v}
          # Dynamically set the exact published tag version in conanfile.txt
          sed -i "s|xyo-sdk/[0-9.]*|xyo-sdk/$TAG_VER|g" example/conanfile.txt

      - name: Install Dependencies for Example App
        run: |
          cd example
          conan install . --build=missing

      - name: Configure CMake
        run: |
          cd example
          cmake --preset conan-release

      - name: Build Example App
        run: |
          cd example
          cmake --build build/Release

      - name: Run Example Application
        run: |
          ./example/build/Release/xyo_example

      - name: Dispatch SDK version update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN }}
          repository: xyo-financial/xyo-financial
          event-type: sdk-version-updated
          client-payload: '{"sdk": "cpp", "version": "${{ github.ref_name }}"}'

  update-vcpkg-port:
    name: Submit vcpkg Upstream Port Bump PR
    needs: [publish-release, verify-example]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Compute Release Tarball Checksum
        id: checksum
        run: |
          TAG_NAME=${{ github.ref_name }}
          TAG_VER=${TAG_NAME#v}
          echo "tag_ver=$TAG_VER" >> $GITHUB_OUTPUT

          TARBALL_URL="https://github.com/xyo-financial/sdk-cpp/archive/refs/tags/${TAG_NAME}.tar.gz"
          echo "Fetching archive from $TARBALL_URL ..."
          SHA512=$(curl -sL "$TARBALL_URL" | sha512sum | awk '{print $1}')

          if [ -z "$SHA512" ] || [ ${#SHA512} -ne 128 ]; then
            echo "Error: Failed to compute valid 128-char SHA512 hash"
            exit 1
          fi
          echo "Computed SHA512: $SHA512"
          echo "sha512=$SHA512" >> $GITHUB_OUTPUT

      - name: Setup vcpkg and Fork
        env:
          GH_TOKEN: ${{ secrets.VCPKG_PR_TOKEN || secrets.SDK_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Hadi Tajallaei"
          git config --global user.email "68777073+syniol@users.noreply.github.com"

          # Fork or clone microsoft/vcpkg
          gh repo fork microsoft/vcpkg --clone=true --remote=true || git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Update Port Manifest & Version Database
        id: update_port
        run: |
          cd vcpkg
          TAG_VER="${{ steps.checksum.outputs.tag_ver }}"
          SHA512="${{ steps.checksum.outputs.sha512 }}"
          BRANCH_NAME="update-xyo-sdk-${TAG_VER}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git checkout master
          git pull upstream master || git pull origin master || true
          git checkout -B "$BRANCH_NAME"

          # 1. Update vcpkg.json version
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$TAG_VER\"/" ports/xyo-sdk/vcpkg.json

          # 2. Update portfile.cmake SHA512
          sed -i -E "s/SHA512 [0-9a-fA-F]+/SHA512 $SHA512/" ports/xyo-sdk/portfile.cmake

          # 3. Update vcpkg version database
          ./vcpkg x-add-version xyo-sdk --overwrite-version

          # 4. Stage and commit
          git add ports/xyo-sdk versions/
          git commit -m "[xyo-sdk] Updated to $TAG_VER"

      - name: Push Branch and Create Upstream Pull Request
        env:
          GH_TOKEN: ${{ secrets.VCPKG_PR_TOKEN || secrets.SDK_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd vcpkg
          TAG_VER="${{ steps.checksum.outputs.tag_ver }}"
          BRANCH_NAME="${{ steps.update_port.outputs.branch_name }}"

          # Push to fork
          git push origin "$BRANCH_NAME" --force

          # Create PR upstream to microsoft/vcpkg following official checklist standards
          PR_TITLE="[xyo-sdk] Updated to $TAG_VER"
          PR_BODY=$(printf -- "- [x] Changes comply with the [maintainer guide](https://github.com/microsoft/vcpkg-docs/blob/main/vcpkg/contributing/maintainer-guide.md).\n- [x] SHA512s are updated for each updated download.\n- [x] The \"supports\" clause reflects platforms that may be fixed by this new version, or no changes were necessary.\n- [x] Any fixed [CI baseline](https://github.com/microsoft/vcpkg/blob/master/scripts/ci.baseline.txt) and [CI feature baseline](https://github.com/microsoft/vcpkg/blob/master/scripts/ci.feature.baseline.txt) entries are removed from that file, or no entries needed to be changed.\n- [x] All patch files in the port are applied and succeed.\n- [x] The version database is fixed by rerunning \`./vcpkg x-add-version --all\` and committing the result.\n- [x] Exactly one version is added in each modified versions file.\n")

          gh pr create \
            --repo microsoft/vcpkg \
            --head "${{ github.repository_owner }}:$BRANCH_NAME" \
            --base master \
            --title "$PR_TITLE" \
            --body "$PR_BODY" || echo "PR creation completed or already exists."

