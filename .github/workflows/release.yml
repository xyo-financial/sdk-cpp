name: Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write # Required for GitHub OIDC signing and attestation
  attestations: write # Required to upload provenance attestations

jobs:
  verify-tag:
    name: Verify Tag Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on main Branch
        run: |
          git branch -r --contains ${{ github.ref_name }} | grep -E "origin/main" || {
            echo "Error: Tag must be pushed from the main branch."
            exit 1;
          }

      # Every packaging manifest carries the version independently, so each one
      # is checked against the tag. Checking only CMakeLists.txt let conanfile.py
      # sit at a stale version through an entire release cycle unnoticed.
      - name: Verify All Manifests Match Git Tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VER=${TAG_NAME#v} # Strip leading 'v'
          echo "Git tag version: $TAG_VER"

          CMAKE_VER=$(grep -oE 'project\(XYOSDK VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CONAN_VER=$(grep -oE '^\s*version\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"' conanfile.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          VCPKG_VER=$(grep -oE '"version"\s*:\s*"[0-9]+\.[0-9]+\.[0-9]+"' packaging/vcpkg/vcpkg.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          STATUS=0
          for entry in "CMakeLists.txt:$CMAKE_VER" "conanfile.py:$CONAN_VER" "packaging/vcpkg/vcpkg.json:$VCPKG_VER"; do
            FILE=${entry%%:*}
            VER=${entry#*:}
            if [ -z "$VER" ]; then
              echo "Error: could not parse a version from $FILE"
              STATUS=1
            elif [ "$VER" != "$TAG_VER" ]; then
              echo "Error: $FILE is at $VER but the tag is $TAG_VER"
              STATUS=1
            else
              echo "OK: $FILE is at $VER"
            fi
          done
          exit $STATUS

  run-tests:
    name: Run Tests
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev build-essential
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXYO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

  publish-release:
    name: Publish Release & Artifacts
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Archive creation
      - name: Build Archive
        run: |
          git archive --format=tar.gz --prefix=xyo-sdk-cpp-${{ github.ref_name }}/ -o xyo-sdk-cpp-${{ github.ref_name }}.tar.gz HEAD

      # 2. Generate Checksums
      - name: Generate SHA-256 Checksum
        run: sha256sum xyo-sdk-cpp-${{ github.ref_name }}.tar.gz > xyo-sdk-cpp-${{ github.ref_name }}.tar.gz.sha256

      # 3. Generate SBOM (Software Bill of Materials)
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: 'spdx-json'
          output-file: 'xyo-sdk-cpp-${{ github.ref_name }}.spdx.json'

      # 4. Generate GitHub Attestation (Provenance & Integrity signatures)
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'xyo-sdk-cpp-${{ github.ref_name }}.tar.gz'

      # 5. Create Github Release with Assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xyo-sdk-cpp-${{ github.ref_name }}.tar.gz
            xyo-sdk-cpp-${{ github.ref_name }}.tar.gz.sha256
            xyo-sdk-cpp-${{ github.ref_name }}.spdx.json
          generate_release_notes: true
          draft: false
          prerelease: false

  verify-example:
    name: Verify Package in Example App
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan & CMake
        run: |
          pip install conan
          conan profile detect --force

      - name: Export Release Version to Conan Cache
        run: |
          TAG_VER=${{ github.ref_name }}
          TAG_VER=${TAG_VER#v} # Strip leading 'v'
          conan export . --version=$TAG_VER

      - name: Configure Example App Dependency
        run: |
          TAG_VER=${{ github.ref_name }}
          TAG_VER=${TAG_VER#v}
          # Dynamically set the exact published tag version in conanfile.txt
          sed -i "s|xyo-sdk-cpp/[0-9.]*|xyo-sdk-cpp/$TAG_VER|g" example/conanfile.txt

      - name: Install Dependencies for Example App
        run: |
          cd example
          conan install . --build=missing

      - name: Configure CMake
        run: |
          cd example
          cmake --preset conan-release

      - name: Build Example App
        run: |
          cd example
          cmake --build build/Release

      - name: Run Example Application
        run: |
          ./example/build/Release/xyo_example

      - name: Dispatch SDK version update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SDK_DISPATCH_TOKEN }}
          repository: xyo-financial/xyo-financial
          event-type: sdk-version-updated
          client-payload: '{"sdk": "cpp", "version": "${{ github.ref_name }}"}'
